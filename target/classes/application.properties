spring.application.name=gestao-api

spring.datasource.url=jdbc:mysql://localhost:3306/lydero?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=gestao_app
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=60
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

app.bootstrap.empresa-nome=${BOOTSTRAP_EMPRESA_NOME:Minha Empresa}
app.bootstrap.admin-nome=${BOOTSTRAP_ADMIN_NOME:Administrador}
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-senha=${BOOTSTRAP_ADMIN_SENHA:}